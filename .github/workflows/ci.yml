name: CI

on:
  # Every branch the work lands on, not only the one it ends on: a push that breaks the build should say so
  # the day it lands rather than when somebody opens a pull request weeks of commits later.
  push:
    branches: [main, staging, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # The completeness specification, which the Java rules are held to as well.
      - run: pnpm test
      - run: pnpm build
